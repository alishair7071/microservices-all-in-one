_format_version: "3.0"
_transform: true

services:
  - name: inventory-service
    url: http://inventory-service.service.consul:4001/products
    routes:
      - name: products
        paths:
          - /api/products
        strip_path: true

  - name: order-service
    url: http://order-service.service.consul:4000/orders
    routes:
      - name: orders
        paths:
          - /api/orders
        strip_path: true

  - name: idempotency-lab
    url: http://payment-service.service.consul:4002/idempotency-lab
    routes:
      - name: idempotency-lab
        paths:
          - /api/idempotency-lab
        strip_path: true

  - name: account-service
    url: http://account-service.service.consul:4006/accounts
    routes:
      - name: account-service
        paths:
          - /api/accounts
        strip_path: true

  - name: circuit-breaker-demo
    url: http://resilience-lab-service.service.consul:4020/circuit-breaker
    routes:
      - name: circuit-breaker-demo
        paths:
          - /api/circuit-breaker-demo
        strip_path: true

  - name: otel-trace-demo
    url: http://resilience-lab-service.service.consul:4020/trace-demo
    routes:
      - name: otel-trace-demo
        paths:
          - /api/otel-trace-demo
        strip_path: true

  - name: retry-demo
    url: http://resilience-lab-service.service.consul:4020/retry
    routes:
      - name: retry-demo
        paths:
          - /api/retry-demo
        strip_path: true

  - name: bulkhead-demo
    url: http://resilience-lab-service.service.consul:4020/bulkhead
    routes:
      - name: bulkhead-demo
        paths:
          - /api/bulkhead-demo
        strip_path: true

  - name: email-service-a
    url: http://email-service-a.service.consul:4003/emails
    routes:
      - name: emails-a
        paths:
          - /api/emails/a
        strip_path: true

  - name: email-service-b
    url: http://email-service-b.service.consul:4003/emails
    routes:
      - name: emails-b
        paths:
          - /api/emails/b
        strip_path: true

  - name: kafka-email-service-a
    url: http://email-service-a.service.consul:4003/kafka/emails
    routes:
      - name: kafka-emails-a
        paths:
          - /api/kafka/emails/a
        strip_path: true

  - name: kafka-email-service-b
    url: http://email-service-b.service.consul:4003/kafka/emails
    routes:
      - name: kafka-emails-b
        paths:
          - /api/kafka/emails/b
        strip_path: true

  - name: notification-service
    url: http://notification-service.service.consul:4004/notifications
    routes:
      - name: notifications
        paths:
          - /api/notifications
        strip_path: true

  - name: kafka-notification-service
    url: http://notification-service.service.consul:4004/kafka/notifications
    routes:
      - name: kafka-notifications
        paths:
          - /api/kafka/notifications
        strip_path: true

  # This service uses the upstream below instead of one fixed Email Service.
  - name: load-balanced-email-health
    host: email-service-upstream
    port: 4003
    protocol: http
    path: /health
    routes:
      - name: load-balanced-email-health
        paths:
          - /api/load-balanced/email-health
        strip_path: true

  # A dedicated route keeps the learning rate limit separate from normal APIs.
  - name: rate-limit-demo
    url: http://inventory-service.service.consul:4001/products
    routes:
      - name: rate-limit-demo
        paths:
          - /api/rate-limit-test
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: local
          limit_by: ip
          hide_client_headers: false

  # This route deliberately bypasses the rate-limit demo. It exercises only the
  # Resilience Lab Service's local admission-control demonstration.
  - name: load-shedding-demo
    url: http://resilience-lab-service.service.consul:4020/load-shedding
    routes:
      - name: load-shedding-demo
        paths:
          - /api/load-shedding-demo
        strip_path: true

upstreams:
  - name: email-service-upstream
    algorithm: round-robin
    targets:
      - target: email-service-a.service.consul:4003
        weight: 100
      - target: email-service-b.service.consul:4003
        weight: 100

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
      exposed_headers:
        - Content-Length
      max_age: 3600
