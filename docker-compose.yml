services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0 -dns-port=8600 -ui
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    networks:
      default: {}
      registry-network:
        ipv4_address: 172.29.250.2
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "4001:4001"
    expose:
      - "50051"
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "4002:4002"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  resilience-target-service:
    build:
      context: .
      dockerfile: resilience-target-service/Dockerfile
    expose:
      - "4010"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4010/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  resilience-lab-service:
    build:
      context: .
      dockerfile: resilience-lab-service/Dockerfile
    expose:
      - "4020"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      resilience-target-service:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4020/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "4000:4000"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      mongo:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      email-service-a:
        condition: service_healthy
      email-service-b:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    ports:
      - "4006:4006"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4006/health"]
      interval: 5s
      timeout: 5s
      retries: 6

  email-service-a:
    image: microservices-demo-email-service:latest
    build:
      context: .
      dockerfile: email-service/Dockerfile
    ports:
      - "4003:4003"
    environment:
      EMAIL_SERVICE_NAME: email-service-A
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_SERVICE_NAME: email-service-a
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  email-service-b:
    image: microservices-demo-email-service:latest
    build:
      context: .
      dockerfile: email-service/Dockerfile
    ports:
      - "4005:4003"
    environment:
      EMAIL_SERVICE_NAME: email-service-B
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_SERVICE_NAME: email-service-b
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "4004:4004"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4004/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  kong:
    image: kong/kong-gateway:3.10.0.2
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_DNS_RESOLVER: 172.29.250.2:8600
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      default: {}
      registry-network: {}
    depends_on:
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      consul:
        condition: service_healthy
      resilience-lab-service:
        condition: service_healthy
      email-service-a:
        condition: service_healthy
      email-service-b:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      kong:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  registry-network:
    ipam:
      config:
        - subnet: 172.29.250.0/24
